name: Deploy site to GitHub Pages

# Builds the production site (dist/) and publishes it to GitHub Pages on
# every push to the default branch. One-time repo setup:
#   Settings → Pages → Build and deployment → Source: "GitHub Actions".
# Students then use:  https://<username>.github.io/<repo>/
# (base './' in vite.config.ts makes relative asset paths work on any subpath.)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck + tests
        run: |
          npm run typecheck
          npm run smoke
          npm run test:remote

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
